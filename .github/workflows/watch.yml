name: crypto-watch

on:
  schedule:
    # 每 5 分钟跑一次 (GitHub 实际会延迟 5-20 分钟, 属正常)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # 需要写 state.json, 与本地共享"已推送"记录

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 跑一轮盯盘
        env:
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SYMBOLS: BTCUSDT,SOLUSDT,ETHUSDT
          COOLDOWN_SEC: "1800"
        run: python watch.py
